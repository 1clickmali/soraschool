<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nettoyage cache SoraSchool</title>
    <style>
      body {
        align-items: center;
        background: #080d1a;
        color: #eef4ff;
        display: flex;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
      }
      main {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 24px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        max-width: 560px;
        padding: 28px;
        width: 100%;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 10px;
      }
      p {
        color: #9aa8bc;
        line-height: 1.6;
        margin: 0 0 20px;
      }
      a {
        background: #2563eb;
        border-radius: 14px;
        color: white;
        display: inline-flex;
        font-weight: 700;
        padding: 12px 16px;
        text-decoration: none;
      }
      code {
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cache local nettoyé</h1>
      <p id="status">Nettoyage du service worker et des caches en cours...</p>
      <a href="/dashboard">Retour au tableau de bord</a>
    </main>
    <script>
      async function clearDevCache() {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
        document.getElementById("status").textContent =
          "C'est bon. Le cache local de localhost est nettoyé. Cliquez sur le bouton, puis faites Cmd+Shift+R si nécessaire.";
      }
      clearDevCache().catch((error) => {
        document.getElementById("status").textContent =
          "Nettoyage partiel. Vous pouvez quand même revenir au tableau de bord puis faire Cmd+Shift+R. Détail : " + error.message;
      });
    </script>
  </body>
</html>
